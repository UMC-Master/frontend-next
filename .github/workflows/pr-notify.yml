name: PR Reviewers & Discord

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Gate (skip for draft/main/develop/fork/chore*/hotfix*)
        id: gate
        env:
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [[ "$IS_DRAFT" == "true" || "$IS_FORK" == "true" || "$PR_BRANCH" == "develop" || "$PR_BRANCH" == "main" || "$PR_BRANCH" == chore* || "$PR_BRANCH" == hotfix* ]]; then
            echo "SKIP=true" >> "$GITHUB_OUTPUT"
          else
            echo "SKIP=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Request Team Reviewers
        if: steps.gate.outputs.SKIP == 'false'
        env:
          GH_TOKEN: ${{ secrets.REVIEW_TOKEN }} # repo + read:org 권한
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::REVIEW_TOKEN secret is missing (repo + read:org permissions required)."
            exit 1
          fi
          TEAM_SLUG="2025-front-end" # 팀 'slug' 여야 함
          curl --fail-with-body -sS -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER/requested_reviewers" \
            -d "{\"team_reviewers\": [\"$TEAM_SLUG\"]}"

      - name: Send Discord Notification
        if: ${{ !cancelled() && steps.gate.outputs.SKIP == 'false' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.PR_BOT_WEBHOOK_URL }}
          DISCORD_ROLE_ID: '1351886402911998012'
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "::error::PR_BOT_WEBHOOK_URL secret is missing."
            exit 1
          fi
          jq -n \
            --arg role "$DISCORD_ROLE_ID" \
            --arg title "$PR_TITLE" \
            --arg url "$PR_URL" \
            --arg author "$PR_AUTHOR" \
            '{
              content: ("<@&" + $role + "> 새로운 PR이 생성되었습니다! 리뷰 부탁드립니다."),
              embeds: [{ title: $title, url: $url, description: ("작성자: **" + $author + "**") }],
              allowed_mentions: { parse: [], roles: [$role] }
            }' > payload.json
          curl --fail-with-body -sS -X POST -H "Content-Type: application/json" \
            -d @payload.json "$DISCORD_WEBHOOK_URL"
