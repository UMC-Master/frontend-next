name: Gemini PR Review (Korean)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: number
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Review with Gemini
        if: github.event_name == 'workflow_dispatch' || (!github.event.pull_request.draft && !github.event.pull_request.head.repo.fork)
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Free-tier eligible; actual billing depends on the API key's project tier.
          GEMINI_REVIEW_MODEL: ${{ vars.GEMINI_REVIEW_MODEL || 'gemini-3.1-flash-lite' }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request?.number || Number(context.payload.inputs?.pr_number);
            if (!Number.isSafeInteger(prNumber) || prNumber <= 0) {
              core.setFailed('A positive PR number is required.');
              return;
            }
            const pr = (await github.rest.pulls.get({ owner, repo, pull_number: prNumber })).data;
            if (pr.state !== 'open' || pr.draft || pr.head.repo?.fork || pr.head.repo?.full_name !== `${owner}/${repo}`) {
              core.info('Skipping closed, draft, or fork PR.');
              return;
            }
            if (!process.env.GEMINI_API_KEY) {
              core.setFailed('GEMINI_API_KEY secret is missing.');
              return;
            }
            if (!process.env.GEMINI_REVIEW_MODEL) {
              core.setFailed('Set the GEMINI_REVIEW_MODEL repository variable to an available Gemini model.');
              return;
            }

            const files = await github.rest.pulls.listFiles({ owner, repo, pull_number: pr.number, per_page: 100 });
            const diffs = files.data
              .filter(f => !!f.patch && ['modified','added','removed','renamed'].includes(f.status))
              .map(f => `### ${f.filename}\n\`\`\`diff\n${f.patch}\n\`\`\``);

            if (diffs.length === 0) {
              core.info('No textual diffs to review.');
              return;
            }

            const MAX_CHARS = 20000;
            let merged = '';
            for (const d of diffs) {
              if ((merged + '\n\n' + d).length > MAX_CHARS) break;
              merged += '\n\n' + d;
            }

            const systemKo = `\
            당신은 HomeMaster 팀의 시니어 엔지니어입니다.
            아래 PR diff를 한국어로 리뷰하세요.
            - 일반적인 칭찬/요약 금지, 구체적이고 실행 가능한 지적만 번호로 제시
            - 버그/보안/성능/접근성/스타일/비용 관점 포함
            - 가능하면 최소 수정 제안(\`\`\`suggestion 코드블록\`\`\`) 제공
            - 맥락이 부족하면 명시적으로 가정 전제 기재
            - 팀 가이드 요약:
              - 컴포넌트: PascalCaseFileName.tsx, Hook: useXxx.ts, 유틸: kebab-case
              - type/interface/enum은 PascalCase, enum 값/상수는 CAPITAL_SNAKE_CASE
              - 같은 slice는 상대경로, 상위→하위 import 최대 2 depth
              - 이미지 webp 사용, Storybook/ESLint/Prettier 준수
            `;

            const userKo = `\
            Repo: ${owner}/${repo}
            PR #${pr.number} by @${pr.user.login}
            다음은 unified diff입니다:
            ${merged}
            `;

            const fetch = global.fetch || (await import('node-fetch')).default;
            const model = process.env.GEMINI_REVIEW_MODEL;
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'x-goog-api-key': process.env.GEMINI_API_KEY },
              body: JSON.stringify({
                contents: [{ role: 'user', parts: [{ text: `${systemKo}\n\n---\n\n${userKo}` }]}],
                generationConfig: { temperature: 0.2 }
              })
            });

            if (!res.ok) {
              const body = await res.text();
              core.setFailed(`Gemini API error: ${res.status} ${body}`);
              return;
            }
            const data = await res.json();
            const text = data?.candidates?.[0]?.content?.parts?.map(p => p.text).join('\n') || '리뷰 결과가 비어 있습니다.';

            const marker = '<!-- gemini-review-bot-kr -->';
            const body = `${marker}\n## 🤖 Gemini Review (ko-KR)\n${text}`;

            const comments = await github.rest.issues.listComments({ owner, repo, issue_number: pr.number, per_page: 100 });
            const mine = comments.data.find(c => c.body?.includes(marker) && c.user?.type === 'Bot');

            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }
